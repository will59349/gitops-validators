name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: ruff + pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck tests/run.sh

  helm-values:
    name: check-helm-values on the fixture chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Install
        run: python -m pip install .
      - name: Good values render clean
        run: check-helm-values tests/fixtures/chart tests/fixtures/chart/values-good.yaml
      - name: Invalid dashboard JSON is caught
        run: |
          set +e
          check-helm-values tests/fixtures/chart tests/fixtures/chart/values-bad-json.yaml | tee out.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          grep -q 'DB001' out.txt
      - name: Invalid alert rule is caught
        run: |
          set +e
          check-helm-values tests/fixtures/chart tests/fixtures/chart/values-bad-rule.yaml | tee out.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          grep -q 'AR002' out.txt
      - name: Render error is reported
        run: |
          set +e
          check-helm-values tests/fixtures/chart tests/fixtures/chart/values-render-error.yaml | tee out.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          grep -q 'HV001' out.txt
