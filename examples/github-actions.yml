# GitHub Actions workflow for a GitOps repository laid out like:
#
#   grafana/alert-rules/     Grafana provisioning YAML or rule ConfigMaps
#   grafana/dashboards/      dashboard JSON or dashboard ConfigMaps
#   charts/monitoring/       kube-prometheus-stack wrapper chart + values-*.yaml
#
# Save as .github/workflows/gitops-validators.yml.

name: gitops-validators

on:
  pull_request:
    paths:
      - "grafana/**"
      - "charts/**"

permissions:
  contents: read

jobs:
  alert-rules-and-dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/will59349/gitops-validators@v0.1.0"
      - name: check-alert-rules
        run: >
          check-alert-rules grafana/alert-rules
          --datasource-uid prometheus-main
          --datasource-uid loki-main
      - name: check-dashboards
        run: >
          check-dashboards grafana/dashboards
          --datasource-uid prometheus-main
          --datasource-uid loki-main

  helm-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - run: pip install "git+https://github.com/will59349/gitops-validators@v0.1.0"
      - name: check-helm-values
        run: >
          check-helm-values charts/monitoring charts/monitoring/values-*.yaml
          --dependency-update
          --kube-version 1.30.0
          --datasource-uid prometheus-main

  # Optional: ask a staging Prometheus whether every expression parses.
  # Only the variable *name* is passed on the command line.
  semantic:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "git+https://github.com/will59349/gitops-validators@v0.1.0"
      - name: check-alert-rules against staging Prometheus
        env:
          PROMETHEUS_TOKEN: ${{ secrets.PROMETHEUS_TOKEN }}
        run: >
          check-alert-rules grafana/alert-rules
          --datasource-uid prometheus-main
          --prometheus-url https://prometheus.staging.example.com
          --bearer-token-env PROMETHEUS_TOKEN
