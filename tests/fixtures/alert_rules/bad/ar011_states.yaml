apiVersion: 1
groups:
  - orgId: 1
    name: node-health
    folder: platform
    interval: 1m
    rules:
      - uid: bad-states
        title: Misspelled states
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-main
            model:
              refId: A
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: noDataState and execErrState are misspelled
        noDataState: Nodata
        execErrState: Err
