apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: node-health
        folder: platform
        rules:
          - uid: node-cpu-high
            title: Node CPU usage high
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus-main
                model: {refId: A, expr: "up == 0"
            labels:
              severity: warning
            annotations:
              summary: CPU is high
