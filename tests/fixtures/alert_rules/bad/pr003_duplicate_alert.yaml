apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: broken-rules
spec:
  groups:
    - name: broken.rules
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 2m
          labels:
            severity: critical
        - alert: NodeDown
          expr: up{job="kubelet"} == 0
          for: 2m
          labels:
            severity: critical
