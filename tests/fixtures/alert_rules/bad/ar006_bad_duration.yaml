apiVersion: 1
groups:
  - orgId: 1
    name: node-health
    folder: platform
    interval: 1 minute
    rules:
      - uid: bad-duration
        title: Durations are not valid
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-main
            model:
              refId: A
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
        for: 5 minutes
        labels:
          severity: warning
        annotations:
          summary: Bad durations
