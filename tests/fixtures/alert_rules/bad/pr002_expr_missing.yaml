apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: broken-rules
spec:
  groups:
    - name: broken.rules
      rules:
        - alert: NodeDown
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: expr is missing
        - alert: NodeEmptyExpr
          expr: ""
          labels:
            severity: critical
