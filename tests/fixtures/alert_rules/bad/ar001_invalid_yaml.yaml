apiVersion: 1
groups:
  - orgId: 1
    name: node-health
    folder: platform
    interval: 1m
    rules:
      - uid: node-cpu-high
        title: Node CPU usage high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-main
            model:
              refId: A
              expr: up == 0
       - refId: C
            datasourceUid: __expr__
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CPU is high
