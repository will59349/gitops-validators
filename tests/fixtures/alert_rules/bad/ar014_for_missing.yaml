apiVersion: 1
groups:
  - orgId: 1
    name: node-health
    folder: platform
    interval: 1m
    rules:
      - uid: no-for
        title: Rule without for
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-main
            model:
              refId: A
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
        labels:
          severity: warning
        annotations:
          summary: No for
