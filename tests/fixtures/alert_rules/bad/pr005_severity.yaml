apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: broken-rules
spec:
  groups:
    - name: broken.rules
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 2m
          labels:
            severity: page
        - alert: NodeNoLabels
          expr: up{job="kubelet"} == 0
          for: 2m
        - record: job:up:count
          expr: count by (job) (up)
