apiVersion: 1
groups:
  - orgId: 1
    name: node-health
    folder: platform
    interval: 1m
    rules:
      - uid: title-dup-a
        title: Node CPU usage high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-main
            model:
              refId: A
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A
      - uid: title-dup-b
        title: Node CPU usage high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus-main
            model:
              refId: A
              expr: up == 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: B
