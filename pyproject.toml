[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitops-validators"
version = "0.1.1"
description = "Pre-merge checks for GitOps repositories carrying Grafana alert rules, Grafana dashboards and kube-prometheus-stack values."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Will Pan" }]
requires-python = ">=3.9"
keywords = ["grafana", "prometheus", "gitops", "kube-prometheus-stack", "pre-commit", "helm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/will59349/gitops-validators"
Issues = "https://github.com/will59349/gitops-validators/issues"

[project.scripts]
check-alert-rules = "gitops_validators.cli:main_alert_rules"
check-dashboards = "gitops_validators.cli:main_dashboards"
check-helm-values = "gitops_validators.cli:main_helm_values"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["gitops_validators"]
